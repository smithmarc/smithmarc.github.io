<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark" disabled />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --surface-2: #efefeb;
      --border: rgba(0,0,0,0.1);
      --border-hover: rgba(0,0,0,0.22);
      --text: #1a1a18;
      --text-2: #6b6b67;
      --text-3: #a0a09c;
      --accent: #185FA5;
      --font: 'DM Sans', system-ui, sans-serif;
      --mono: 'DM Mono', monospace;
      --radius-md: 8px;
      --radius-lg: 12px;
      --sidebar-w: 220px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a18;
        --surface: #242422;
        --surface-2: #2e2e2c;
        --border: rgba(255,255,255,0.1);
        --border-hover: rgba(255,255,255,0.22);
        --text: #f0efe8;
        --text-2: #a0a09c;
        --text-3: #6b6b67;
        --accent: #4d9de0;
      }
      #hljs-light { disabled: true; }
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── TABS BAR ── */
    .tabs-bar {
      display: flex;
      align-items: stretch;
      background: var(--surface-2);
      border-bottom: 0.5px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      font-size: 13px;
      color: var(--text-2);
      cursor: pointer;
      border-right: 0.5px solid var(--border);
      white-space: nowrap;
      user-select: none;
      background: var(--surface-2);
      transition: background 0.1s, color 0.1s;
      min-width: 0;
      max-width: 180px;
    }
    .tab:hover { background: var(--surface); color: var(--text); }
    .tab.active { background: var(--surface); color: var(--text); font-weight: 500; }
    .tab-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      outline: none;
    }
    .tab-name[contenteditable="true"] {
      background: var(--surface-2);
      border-radius: 3px;
      padding: 0 3px;
      min-width: 60px;
    }
    .tab-close {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-3);
      font-size: 13px;
      padding: 0 1px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      border-radius: 3px;
    }
    .tab-close:hover { color: var(--text); background: var(--border); }
    .tab-new {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-2);
      font-size: 18px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      transition: color 0.1s;
      flex-shrink: 0;
    }
    .tab-new:hover { color: var(--text); }

    /* ── TOOLBAR ── */
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 0.5px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      flex-wrap: wrap;
      row-gap: 6px;
    }

    .tb-sep { width: 0.5px; height: 18px; background: var(--border); margin: 0 1px; flex-shrink: 0; }
    .tb-spacer { flex: 1; min-width: 8px; }

    .tb-btn {
      background: none;
      border: 0.5px solid transparent;
      border-radius: var(--radius-md);
      padding: 4px 8px;
      font-size: 13px;
      font-family: var(--mono);
      color: var(--text-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
      white-space: nowrap;
    }
    .tb-btn:hover { background: var(--surface-2); border-color: var(--border); color: var(--text); }
    .tb-btn.active { background: var(--surface-2); border-color: var(--border); color: var(--text); }

    /* ── STATS BAR ── */
    .stats-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 5px 16px;
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      flex-shrink: 0;
    }
    .stat {
      font-size: 12px;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .goal-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-left: auto;
    }
    .goal-label { font-size: 12px; color: var(--text-3); }
    .goal-track {
      width: 90px;
      height: 4px;
      background: var(--surface-2);
      border-radius: 4px;
      overflow: hidden;
      border: 0.5px solid var(--border);
    }
    .goal-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.3s;
      max-width: 100%;
    }
    .goal-fill.done { background: #3B6D11; }
    .goal-input {
      width: 54px;
      background: none;
      border: 0.5px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 12px;
      font-family: var(--font);
      color: var(--text-2);
      outline: none;
      text-align: right;
    }
    .goal-input:focus { border-color: var(--border-hover); }

    /* ── LAYOUT ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── TOC SIDEBAR ── */
    .toc-sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      border-right: 0.5px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.2s;
    }
    .toc-sidebar.collapsed { width: 0; border-right: none; }
    .toc-header {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 8px 14px 6px;
      border-bottom: 0.5px solid var(--border);
      flex-shrink: 0;
    }
    .toc-list {
      overflow-y: auto;
      flex: 1;
      padding: 8px 0;
    }
    .toc-item {
      display: block;
      padding: 4px 14px;
      font-size: 13px;
      color: var(--text-2);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-radius: 0;
      transition: background 0.1s, color 0.1s;
      text-decoration: none;
    }
    .toc-item:hover { background: var(--surface-2); color: var(--text); }
    .toc-item.h1 { font-weight: 500; color: var(--text); padding-left: 14px; }
    .toc-item.h2 { padding-left: 22px; font-size: 12.5px; }
    .toc-item.h3 { padding-left: 32px; font-size: 12px; color: var(--text-3); }
    .toc-empty { padding: 12px 14px; font-size: 12px; color: var(--text-3); font-style: italic; }

    /* ── PANES ── */
    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .pane + .pane { border-left: 0.5px solid var(--border); }

    .pane-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-3);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 7px 16px 6px;
      border-bottom: 0.5px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    #editor {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      padding: 20px;
      font-family: var(--mono);
      font-size: 13.5px;
      line-height: 1.8;
      color: var(--text);
      background: var(--bg);
      overflow-y: auto;
    }

    #preview {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
      background: var(--surface);
      font-size: 15px;
      line-height: 1.8;
      color: var(--text);
    }

    #preview h1 { font-size: 24px; font-weight: 500; margin: 0 0 14px; padding-bottom: 10px; border-bottom: 0.5px solid var(--border); }
    #preview h2 { font-size: 19px; font-weight: 500; margin: 28px 0 10px; }
    #preview h3 { font-size: 16px; font-weight: 500; margin: 22px 0 8px; }
    #preview p  { margin: 0 0 14px; }
    #preview ul, #preview ol { padding-left: 1.5rem; margin: 0 0 14px; }
    #preview li { margin-bottom: 5px; }
    #preview strong { font-weight: 500; }
    #preview em { font-style: italic; }
    #preview del { opacity: 0.5; }
    #preview a { color: var(--accent); text-decoration: none; }
    #preview a:hover { text-decoration: underline; }
    #preview code {
      font-family: var(--mono);
      font-size: 12.5px;
      background: var(--surface-2);
      border: 0.5px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
    }
    #preview pre {
      background: var(--surface-2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0;
      margin: 0 0 14px;
      overflow-x: auto;
    }
    #preview pre code {
      background: none !important;
      border: none;
      padding: 14px 16px;
      font-size: 13px;
      display: block;
    }
    #preview blockquote { border-left: 2px solid var(--border-hover); border-radius: 0; padding-left: 14px; color: var(--text-2); margin: 0 0 14px; }
    #preview hr { border: none; border-top: 0.5px solid var(--border); margin: 20px 0; }
    #preview table { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 14px; }
    #preview th, #preview td { border: 0.5px solid var(--border); padding: 7px 12px; text-align: left; }
    #preview th { background: var(--surface-2); font-weight: 500; }
    #preview img { max-width: 100%; border-radius: var(--radius-md); }

    /* ── FOCUS MODE ── */
    .focus-mode .toc-sidebar { width: 0; border-right: none; }
    .focus-mode .pane + .pane { display: none; }
    .focus-mode #editor { max-width: 700px; margin: 0 auto; background: var(--surface); }

    /* ── HLJS DARK OVERRIDE ── */
    @media (prefers-color-scheme: dark) {
      #hljs-light { display: none; }
      #hljs-dark { display: block !important; }
      .hljs { background: var(--surface-2) !important; }
    }

    @media (max-width: 768px) {
      .toc-sidebar { display: none; }
      .main { flex-direction: column; }
      .pane + .pane { border-left: none; border-top: 0.5px solid var(--border); }
      body { overflow: auto; }
      .main { overflow: visible; }
      #editor, #preview { min-height: 40vh; }
    }
  </style>
</head>
<body>

<!-- TABS -->
<div class="tabs-bar" id="tabs-bar">
  <!-- rendered by JS -->
  <button class="tab-new" id="btn-new-tab" title="New document" aria-label="New document"><i class="ti ti-plus" aria-hidden="true"></i></button>
</div>

<!-- TOOLBAR -->
<header>
  <button class="tb-btn" data-wrap="**" data-wrap-end="**" title="Bold (Ctrl+B)"><i class="ti ti-bold" aria-hidden="true"></i></button>
  <button class="tb-btn" data-wrap="_" data-wrap-end="_" title="Italic (Ctrl+I)"><i class="ti ti-italic" aria-hidden="true"></i></button>
  <button class="tb-btn" data-wrap="`" data-wrap-end="`" title="Inline code"><i class="ti ti-code" aria-hidden="true"></i></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" data-line="## " title="Heading 2">H2</button>
  <button class="tb-btn" data-line="### " title="Heading 3">H3</button>
  <button class="tb-btn" data-line="- " title="Bullet list"><i class="ti ti-list" aria-hidden="true"></i></button>
  <button class="tb-btn" data-line="1. " title="Ordered list"><i class="ti ti-list-numbers" aria-hidden="true"></i></button>
  <button class="tb-btn" data-line="> " title="Blockquote"><i class="ti ti-blockquote" aria-hidden="true"></i></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-link" title="Insert link (Ctrl+K)"><i class="ti ti-link" aria-hidden="true"></i></button>
  <button class="tb-btn" id="btn-hr" title="Horizontal rule"><i class="ti ti-minus" aria-hidden="true"></i></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-toc" title="Toggle table of contents"><i class="ti ti-list-tree" aria-hidden="true"></i> ToC</button>
  <button class="tb-btn" id="btn-focus" title="Focus mode"><i class="ti ti-focus" aria-hidden="true"></i> Focus</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-copy" title="Copy markdown"><i class="ti ti-copy" aria-hidden="true"></i> Copy</button>
  <button class="tb-btn" id="btn-export-md" title="Download .md"><i class="ti ti-download" aria-hidden="true"></i> .md</button>
  <button class="tb-btn" id="btn-export-html" title="Export as HTML"><i class="ti ti-file-type-html" aria-hidden="true"></i> HTML</button>
</header>

<!-- STATS BAR -->
<div class="stats-bar">
  <span class="stat"><i class="ti ti-letter-case" aria-hidden="true"></i> <span id="stat-words">0 words</span></span>
  <span class="stat"><i class="ti ti-clock" aria-hidden="true"></i> <span id="stat-read">0 min read</span></span>
  <span class="stat"><i class="ti ti-letter-spacing" aria-hidden="true"></i> <span id="stat-chars">0 chars</span></span>
  <div class="goal-wrap">
    <span class="goal-label">Goal:</span>
    <input class="goal-input" id="goal-input" type="number" min="0" max="99999" value="500" title="Word goal" aria-label="Word count goal" />
    <span class="goal-label">words</span>
    <div class="goal-track" title="Progress toward goal">
      <div class="goal-fill" id="goal-fill" style="width:0%"></div>
    </div>
    <span class="goal-label" id="goal-pct">0%</span>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="main">
  <aside class="toc-sidebar collapsed" id="toc-sidebar" aria-label="Table of contents">
    <div class="toc-header">Contents</div>
    <div class="toc-list" id="toc-list"></div>
  </aside>
  <div class="pane">
    <div class="pane-label">Markdown</div>
    <textarea id="editor" spellcheck="true" placeholder="Start writing…" aria-label="Markdown input"></textarea>
  </div>
  <div class="pane" id="preview-pane">
    <div class="pane-label">Preview</div>
    <div id="preview" aria-label="Rendered preview" aria-live="polite"></div>
  </div>
</div>

<script>
// ── DEFAULTS ──────────────────────────────────────────────────────────────────
const DEFAULT_CONTENT = `# Welcome to Markdown Editor

A clean, distraction-free writing tool with **live preview**. All your documents are saved automatically.

## What's new

- **Document tabs** — manage multiple documents, rename with a double-click
- **Table of contents** — click the ToC button to navigate by heading
- **Syntax highlighting** — code blocks get full language highlighting
- **Export to HTML** — download a fully styled, self-contained web page
- **Word goal** — track progress with the bar in the stats strip below the toolbar

## Formatting quick reference

Use \`**bold**\` for **bold**, \`_italic_\` for _italic_, and \`~~strikethrough~~\` for ~~strikethrough~~.

### Code blocks

\`\`\`js
function greet(name) {
  return \`Hello, \${name}!\`;
}
\`\`\`

### Blockquotes

> "The secret of getting ahead is getting started." — Mark Twain

---

Happy writing!
`;

// ── STATE ─────────────────────────────────────────────────────────────────────
let docs, activeId;

function loadState() {
  try {
    const raw = localStorage.getItem('md_editor_v2');
    if (raw) {
      const s = JSON.parse(raw);
      docs = s.docs;
      activeId = s.activeId;
      return;
    }
  } catch(e) {}
  const id = uid();
  docs = [{ id, name: 'Untitled', content: DEFAULT_CONTENT }];
  activeId = id;
}

function saveState() {
  try { localStorage.setItem('md_editor_v2', JSON.stringify({ docs, activeId })); } catch(e) {}
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function activeDoc() { return docs.find(d => d.id === activeId); }

// ── MARKDOWN PARSER ───────────────────────────────────────────────────────────
function parseMarkdown(md) {
  let html = md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code class="${lang ? 'language-' + lang : ''}">${code.trim()}</code></pre>`)
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/^#{3} (.+)$/gm,'<h3>$1</h3>')
    .replace(/^#{2} (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/_(.+?)_/g,'<em>$1</em>')
    .replace(/~~(.+?)~~/g,'<del>$1</del>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" />')
    .replace(/^---$/gm,'<hr>')
    .replace(/^> (.+)$/gm,'<blockquote><p>$1</p></blockquote>')
    .replace(/^(\d+)\. (.+)$/gm,'<li data-ol>$2</li>')
    .replace(/^- (.+)$/gm,'<li>$1</li>');

  html = html
    .replace(/(<li data-ol>[\s\S]*?<\/li>)(\n(?!<li data-ol>)|$)/g, m =>
      `<ol>${m.replace(/ data-ol/g,'')}</ol>`)
    .replace(/(<li>[\s\S]*?<\/li>)(\n(?!<li>)|$)/g, m => `<ul>${m}</ul>`);

  html = html.split(/\n{2,}/).map(block => {
    const t = block.trim();
    if (!t) return '';
    if (/^<(h[1-6]|ul|ol|pre|blockquote|hr|img)/.test(t)) return t;
    return `<p>${t.replace(/\n/g,' ')}</p>`;
  }).join('\n');

  return html;
}

// ── DOM REFS ──────────────────────────────────────────────────────────────────
const editor    = document.getElementById('editor');
const preview   = document.getElementById('preview');
const tabsBar   = document.getElementById('tabs-bar');
const tocList   = document.getElementById('toc-list');
const tocSidebar= document.getElementById('toc-sidebar');
const mainEl    = document.getElementById('main');
const goalInput = document.getElementById('goal-input');
const goalFill  = document.getElementById('goal-fill');
const goalPct   = document.getElementById('goal-pct');

// ── TABS ──────────────────────────────────────────────────────────────────────
function renderTabs() {
  // Remove existing tabs (keep the new-tab button)
  tabsBar.querySelectorAll('.tab').forEach(t => t.remove());
  const newBtn = document.getElementById('btn-new-tab');

  docs.forEach(doc => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (doc.id === activeId ? ' active' : '');
    tab.dataset.id = doc.id;

    const nameEl = document.createElement('span');
    nameEl.className = 'tab-name';
    nameEl.textContent = doc.name;
    nameEl.title = 'Double-click to rename';

    nameEl.addEventListener('dblclick', e => {
      e.stopPropagation();
      nameEl.contentEditable = 'true';
      nameEl.focus();
      const range = document.createRange();
      range.selectNodeContents(nameEl);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
    });
    nameEl.addEventListener('blur', () => {
      nameEl.contentEditable = 'false';
      doc.name = nameEl.textContent.trim() || 'Untitled';
      nameEl.textContent = doc.name;
      saveState();
    });
    nameEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); }
      if (e.key === 'Escape') { nameEl.textContent = doc.name; nameEl.blur(); }
    });

    const closeBtn = document.createElement('button');
    closeBtn.className = 'tab-close';
    closeBtn.innerHTML = '<i class="ti ti-x" aria-hidden="true"></i>';
    closeBtn.title = 'Close document';
    closeBtn.addEventListener('click', e => {
      e.stopPropagation();
      closeDoc(doc.id);
    });

    tab.appendChild(nameEl);
    tab.appendChild(closeBtn);
    tab.addEventListener('click', () => switchDoc(doc.id));
    tabsBar.insertBefore(tab, newBtn);
  });
}

function switchDoc(id) {
  // Save current editor content first
  const cur = activeDoc();
  if (cur) cur.content = editor.value;
  activeId = id;
  const doc = activeDoc();
  editor.value = doc ? doc.content : '';
  renderTabs();
  update();
  saveState();
}

function newDoc() {
  const cur = activeDoc();
  if (cur) cur.content = editor.value;
  const id = uid();
  docs.push({ id, name: 'Untitled', content: '' });
  activeId = id;
  renderTabs();
  editor.value = '';
  update();
  editor.focus();
  saveState();
  // Trigger rename immediately
  const newTab = tabsBar.querySelector(`.tab[data-id="${id}"] .tab-name`);
  if (newTab) {
    newTab.contentEditable = 'true';
    newTab.focus();
    const range = document.createRange();
    range.selectNodeContents(newTab);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
  }
}

function closeDoc(id) {
  if (docs.length === 1) {
    // Reset to blank instead of deleting last tab
    docs[0].content = '';
    docs[0].name = 'Untitled';
    editor.value = '';
    renderTabs();
    update();
    saveState();
    return;
  }
  const idx = docs.findIndex(d => d.id === id);
  docs.splice(idx, 1);
  if (activeId === id) {
    activeId = docs[Math.min(idx, docs.length - 1)].id;
    editor.value = activeDoc().content;
  }
  renderTabs();
  update();
  saveState();
}

// ── TOC ───────────────────────────────────────────────────────────────────────
function buildToc(md) {
  const headings = [...md.matchAll(/^(#{1,3}) (.+)$/gm)];
  if (!headings.length) {
    tocList.innerHTML = '<span class="toc-empty">No headings yet</span>';
    return;
  }
  tocList.innerHTML = '';
  headings.forEach(([, hashes, text]) => {
    const level = hashes.length;
    const a = document.createElement('a');
    a.className = `toc-item h${level}`;
    a.textContent = text;
    a.href = '#';
    a.addEventListener('click', e => {
      e.preventDefault();
      // Find the heading in the preview and scroll to it
      const allHeadings = preview.querySelectorAll('h1,h2,h3');
      for (const el of allHeadings) {
        if (el.textContent.trim() === text.trim()) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          break;
        }
      }
    });
    tocList.appendChild(a);
  });
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function updateStats(md) {
  const words = md.trim() ? md.trim().split(/\s+/).length : 0;
  const chars = md.length;
  const readMins = Math.max(1, Math.round(words / 200));
  const goal = parseInt(goalInput.value) || 0;
  const pct = goal > 0 ? Math.min(100, Math.round((words / goal) * 100)) : 0;

  document.getElementById('stat-words').textContent = `${words.toLocaleString()} word${words !== 1 ? 's' : ''}`;
  document.getElementById('stat-read').textContent = `${readMins} min read`;
  document.getElementById('stat-chars').textContent = `${chars.toLocaleString()} chars`;
  goalFill.style.width = pct + '%';
  goalFill.classList.toggle('done', pct >= 100);
  goalPct.textContent = pct + '%';
}

// ── UPDATE ────────────────────────────────────────────────────────────────────
function update() {
  const md = editor.value;
  preview.innerHTML = parseMarkdown(md);
  // Syntax highlighting
  preview.querySelectorAll('pre code').forEach(block => {
    if (typeof hljs !== 'undefined') hljs.highlightElement(block);
  });
  buildToc(md);
  updateStats(md);
  const doc = activeDoc();
  if (doc) doc.content = md;
  saveState();
}

// ── EDITOR HELPERS ────────────────────────────────────────────────────────────
function insertWrap(before, after) {
  const s = editor.selectionStart, e = editor.selectionEnd;
  const sel = editor.value.slice(s, e) || 'text';
  editor.setRangeText(before + sel + after, s, e, 'select');
  editor.focus(); update();
}

function insertLine(prefix) {
  const s = editor.selectionStart;
  const lineStart = editor.value.lastIndexOf('\n', s - 1) + 1;
  editor.setRangeText(prefix, lineStart, lineStart, 'end');
  editor.focus(); update();
}

// ── TOOLBAR EVENTS ────────────────────────────────────────────────────────────
document.querySelectorAll('[data-wrap]').forEach(btn =>
  btn.addEventListener('click', () => insertWrap(btn.dataset.wrap, btn.dataset.wrapEnd)));

document.querySelectorAll('[data-line]').forEach(btn =>
  btn.addEventListener('click', () => insertLine(btn.dataset.line)));

document.getElementById('btn-link').addEventListener('click', () => {
  const s = editor.selectionStart, e = editor.selectionEnd;
  const sel = editor.value.slice(s, e) || 'link text';
  editor.setRangeText(`[${sel}](https://example.com)`, s, e, 'end');
  editor.focus(); update();
});

document.getElementById('btn-hr').addEventListener('click', () => {
  const s = editor.selectionStart;
  const before = editor.value.slice(0, s);
  const needsNewline = before.length && !before.endsWith('\n');
  editor.setRangeText((needsNewline ? '\n' : '') + '\n---\n\n', s, s, 'end');
  editor.focus(); update();
});

document.getElementById('btn-toc').addEventListener('click', function() {
  tocSidebar.classList.toggle('collapsed');
  this.classList.toggle('active');
});

document.getElementById('btn-focus').addEventListener('click', function() {
  mainEl.classList.toggle('focus-mode');
  this.classList.toggle('active');
  this.querySelector('i').className = mainEl.classList.contains('focus-mode')
    ? 'ti ti-focus-off' : 'ti ti-focus';
});

document.getElementById('btn-copy').addEventListener('click', function() {
  navigator.clipboard.writeText(editor.value).then(() => {
    const orig = this.innerHTML;
    this.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> Copied!';
    setTimeout(() => { this.innerHTML = orig; }, 1800);
  });
});

document.getElementById('btn-export-md').addEventListener('click', () => {
  const name = (activeDoc()?.name || 'document').replace(/[^a-z0-9_-]/gi, '-');
  const blob = new Blob([editor.value], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '.md';
  a.click();
  URL.revokeObjectURL(a.href);
});

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '.html';
  a.click();
  URL.revokeObjectURL(a.href);

document.getElementById('btn-new-tab').addEventListener('click', newDoc);

goalInput.addEventListener('input', () => updateStats(editor.value));

editor.addEventListener('input', update);

editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart;
    editor.setRangeText('  ', s, s, 'end');
    update();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'b') { e.preventDefault(); insertWrap('**','**'); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'i') { e.preventDefault(); insertWrap('_','_'); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('btn-link').click(); }
});

// ── INIT ──────────────────────────────────────────────────────────────────────
loadState();
renderTabs();
const doc = activeDoc();
editor.value = doc ? doc.content : DEFAULT_CONTENT;
update();

// Apply dark mode hljs correctly on init
if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.getElementById('hljs-dark').removeAttribute('disabled');
  document.getElementById('hljs-light').setAttribute('disabled', '');
}
</script>
